[project]
name = "mac-computer-use"
version = "0.1.0"
description = "MCP server that gives your Claude eyes, a mouse and a keyboard on your Mac"
readme = "README.md"
keywords = ["mcp", "model-context-protocol", "macos", "accessibility", "claude", "automation"]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "mcp>=2,<3",
    "pyautogui>=0.9.54",
    "pillow>=10",
    "pyobjc-framework-ApplicationServices>=10",
    "pyobjc-framework-Cocoa>=10",
    "pyobjc-framework-Quartz>=10",
    "pyobjc-framework-Vision>=10",
]

[project.urls]
Homepage = "https://github.com/AMIRMACHAU/mac-computer-use"
Repository = "https://github.com/AMIRMACHAU/mac-computer-use"

[project.scripts]
mac-computer-use = "server:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gui: needs a real app on screen and Accessibility permission"]
addopts = "-m 'not gui' -q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server", "executor", "targeting", "envmemory", "plans", "sight"]
